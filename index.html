<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Inicia sesión o accede con Google o Facebook a la plataforma de Accesibilidad Digital.">
    <title>Login — Accesibilidad Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="imagen">
        <img src="assets/images/bienvenida.png" alt="Imagen de bienvenida">
    </div>

    <div class="contenedor_login">
        <form action="/login" method="POST">
            <fieldset>
                <legend>Iniciar sesión</legend>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <a href="app.html" class="btn-entrar">Entrar</a>
            </fieldset>
            <div class="separador"><hr><span>o</span><hr></div>
            <fieldset>
                <legend>Nuevo usuario</legend>
                <div class="social-btns">
                    <button type="button" class="btn-social">
                        <img src="assets/images/google.jpg" alt="Google">
                        Acceder con Google
                    </button>
                    <button type="button" class="btn-social">
                        <img src="assets/images/facebook.jpg" alt="Facebook">
                        Acceder con Facebook
                    </button>
                </div>
            </fieldset>
        </form>
    </div>

</body>
</html>
